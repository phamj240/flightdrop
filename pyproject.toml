[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdrop"
version = "0.1.0"
description = "Personal flight-deal alert bot: scans cached fares and deal feeds, posts to Discord."
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "feedparser>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightdrop = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

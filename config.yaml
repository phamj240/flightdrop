# flightdrop settings. Secrets (API tokens, webhook URL) are NOT here;
# they come from environment variables / GitHub Actions secrets.
# To change anything: edit this file (or ask Claude to). Invalid edits fail with a clear error.

home_airports: [MSP, DFW]
cabins: [economy, business]      # the fare data is economy-only; business deals appear only when a deal-feed post mentions one
timezone: America/Chicago        # used for the alert hours and the "5 alerts per day" count
max_alerts_per_day: 5

# Alerts are only posted inside this window (local time in `timezone`, adjusts for daylight saving).
# Scans outside it still run and record prices, but hold deals until the next scan inside the window.
# Quote the times. Remove this line to allow alerts at any hour.
alert_hours: {start: "08:00", end: "21:30"}

# --- Where you want to go ------------------------------------------------
# Empty lists = anywhere. include_regions and include_countries are combined (either matches).
# Regions: domestic, nearby_intl, europe, asia_oceania, other_intl
destinations:
  include_regions: [europe]      # all of Europe (Switzerland and Italy get looser price bars below)
  include_countries: [GT, ID, JP, VN, KG, KZ]   # Guatemala, Indonesia, Japan, Vietnam, Kyrgyzstan, Kazakhstan
  exclude_countries: [IQ, AF, SY, YE, LY, SO, SD, SS, RU, BY]   # conflict zones / no-go countries; edit freely
  exclude_airports: []           # e.g. [JFK]

# --- Watchlist: always alert when the target price is met -----------------
# Ignores the destination filters and the price rules above/below (trip window still applies).
# 'from' is optional and defaults to all home_airports.
watchlist:
  # Memphis -> Minneapolis round trip with a MOVING target: alerts on the first fare seen, then only when
  # a fare is at least $1 lower than the last one you were alerted about. (Add `max_price_usd: 400` to
  # also set a ceiling.) The fare data has no cached fares for this route yet, so this only fires once
  # a traveler's search puts the route in the cache.
  - {from: MEM, to: MSP, cabin: economy, alert_when: lower_than_previous}
#  - {to: NRT, cabin: economy, max_price_usd: 800}                 # fixed target
#  - {from: MSP, to: LIS, cabin: business, max_price_usd: 1500}    # business can't be checked (no fare data)

# --- Airlines -------------------------------------------------------------
# 2-character airline codes (shown in alerts as e.g. "Frontier (F9)"). Empty = any airline.
# 'exclude' always wins. Also applies to watchlist routes. Not applied to deal-feed posts.
# Common codes: F9 Frontier, NK Spirit, SY Sun Country, G4 Allegiant, WN Southwest, DL Delta,
# UA United, AA American, AS Alaska, B6 JetBlue.
airlines:
  include: []                    # e.g. [DL, UA, AA] to only see those carriers
  exclude: []                    # e.g. [F9, NK] to never see Frontier or Spirit
  # Not a filter: when an alert is for one of these carriers, it also shows the cheapest fare
  # on ANY OTHER airline for the same route, so you can see a realistic alternative.
  alternatives_for: [F9, NK]

# --- Trip window ----------------------------------------------------------
trip:
  min_days: 2                    # round-trip length
  max_days: 30                   # null = no limit
  depart_in_days: {min: 3, max: null}   # how far ahead the departure may be (days from today)
  depart_months: []              # e.g. [3, 4, 10] to only depart in those months

# --- What counts as a deal ------------------------------------------------
# "Cheap vs. usual": alert if price <= max_ratio * median of the last window_days.
# Needs min_samples past observations of the same route + cabin to apply.
relative:
  window_days: 60
  min_samples: 5
  max_ratio: 0.70

# "Fixed price": alert if round-trip price (USD) <= threshold for the destination region.
# Starting guesses; tune after seeing real data.
thresholds_usd:
  domestic:     {economy: 150, business: 600}
  nearby_intl:  {economy: 300, business: 900}    # Canada, Mexico, Caribbean, Central America
  europe:       {economy: 550, business: 1600}
  asia_oceania: {economy: 750, business: 2200}
  other_intl:   {economy: 650, business: 2000}   # South America, Africa, Middle East
# (the business numbers are currently unused: there is no business fare data to compare against)

# Country-specific "good deal" prices (round trip, USD). These override the regional price above for
# that destination country. Starting guesses based on the live fare data; tune them as you learn what
# a good price really is. Switzerland and Italy are looser than the rest of Europe ($550) on purpose.
thresholds_by_country:
  GT: {economy: 500}      # Guatemala
  CH: {economy: 750}      # Switzerland
  IT: {economy: 650}      # Italy
  ID: {economy: 1000}     # Indonesia
  JP: {economy: 750}      # Japan
  VN: {economy: 900}      # Vietnam
  KG: {economy: 1100}     # Kyrgyzstan
  KZ: {economy: 1100}     # Kazakhstan

# Re-alert an already-posted deal only if the price dropped by at least this fraction.
realert_min_drop: 0.10

# Optional live-price confirmation via SerpApi (free plan: 250 searches/month).
verify:
  enabled: true
  daily_budget: 6
  monthly_budget: 240
  max_live_over_cached: 1.15     # drop the deal if the live price is >15% above the cached one

# Human-curated deal feeds. Only posts departing from a keyword city are kept (title + link only).
# These feeds rarely mention any one airport, so expect an occasional extra deal, not a stream.
# TheFlightDeal posts about one Dallas deal a day around midday Central; it has no Minneapolis feed.
# Not used: Secret Flying (blocks automated requests), Fly4Free (Europe only), r/flightdeals (its
# reachable feed is a frozen ~3-year-old snapshot and the live feeds are blocked).
rss:
  enabled: true
  max_age_hours: 48              # ignore older posts (fares expire fast)
  keywords: [MSP, Minneapolis, DFW, Dallas]
  feeds:
    theflightdeal: https://www.theflightdeal.com/feed/                 # all cities, last ~day
    theflightdeal_dallas: https://www.theflightdeal.com/category/dallas/feed/   # Dallas, last ~2 weeks
